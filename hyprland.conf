

###############################
### HYPRLAND CONFIG  ###
###############################

# Docs: https://wiki.hyprland.org/Configuring/
# Tip: you can split config into multiple files and load them with `source = ...`.


################
### INCLUDES ###
################

# Generated by pywal (updated by ~/.config/hypr/scripts/wallpaper.sh)
source = ~/.config/hypr/colors.conf

# Optional split config files (uncomment if you start using them)
# source = ~/.config/hypr/monitors.conf
# source = ~/.config/hypr/workspaces.conf


#################
### VARIABLES ###
#################

# Main modifier key used throughout binds
$mainMod = SUPER

# Apps
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = zen-browser


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/


# monitor = eDP-1, disable
# monitor = HDMI-A-5, 1920x1080@60, 0x0, 1


monitor = eDP-1, 1920x1080@144, 0x0, 1
# monitor = HDMI-A-5, 1920x1080@60, 0x0, 1 ,mirror, eDP-1

# monitor=HDMI-A-1,preffered,auto,1


#################
### AUTOSTART ###
#################

# Keyring / polkit
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/bin/kwalletd6
#exec-once = waypaper --restore &

# Wallpaper: restore what was last set by ~/.config/hypr/scripts/wallpaper.sh
exec-once = ~/.config/hypr/scripts/restore-wallpaper.sh &

# Tray / networking
exec-once = nm-applet &

# Shell / bars
#exec-once = QT_QPA_PLATFORM=wayland quickshell -p /home/nivedck/.config/quickshell/nived/bar-shell.qml &
exec-once = noctalia
# exec-once = waybar

# Idle / notifications
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
# exec-once = swaync
# exec-once = quickshell --config silly-notifs

# Cursor theme (runtime)
exec-once = hyprctl setcursor WhiteSur-cursors 24

# Clipboard history (cliphist)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Plugins
exec-once = hyprpm reload -n # Loads plugins on startup


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,macOS-White
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,macOS-White
env = HYPRCURSOR_SIZE,24
env = XDG_MENU_PREFIX,arch-
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Permission changes require a Hyprland restart and are not applied on-the-fly.

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# General layout / gaps / borders
general {
    gaps_in = 6
    gaps_out =6

    border_size = 2

    # Border colors come from ~/.config/hypr/colors.conf (pywal)
    # col.active_border = ...
    # col.inactive_border = ...

    # Enable resizing windows by clicking and dragging on borders/gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before enabling
    allow_tearing = false

    layout = dwindle
}

# Window decorations: rounding, opacity, blur
decoration {
    rounding =12
    rounding_power = 2

    active_opacity = 0.85
    inactive_opacity = 0.7

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 2
        passes =5
        vibrancy = 0
    }
}

# Animations
animations {
    enabled = yes

    # Some default animations, see https://hypr.land for more
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Alternative animation presets (kept for reference)
# animations {
#   enabled =  true
#   bezier =  overshot, 0.05, 0.9, 0.1, 1.05
#   bezier =  smoothOut, 0.36, 0, 0.66, -0.56
#   bezier =  smoothIn, 0.25, 1, 0.5, 1
#   bezier =  linear, 0.0, 0.0,1.0,1.0
#
#   animation =  windows, 1, 3, overshot, slide
#   animation =  windowsOut, 1, 4, smoothOut, slide
#   animation =  windowsMove, 1, 4, default
#   animation =  border, 1, 10, default
#   animation =  fade, 1, 10, smoothIn
#   animation =  fadeDim, 1, 10, smoothIn
#   animation =  workspaces, 1, 4, default , #slidevert
#   animation =  borderangle, 1, 30,linear,loop
# }

# Workspace “smart gaps” examples (kept for reference)
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# Layout-specific settings
dwindle {
    # pseudotile = true # toggled via bind: $mainMod + P
    preserve_split = true # keep splits stable
}

master {
    new_status = master
}

# Misc settings
misc {
    force_default_wallpaper = -1 # Set to 0/1 to disable the mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background.
    vrr = 2
}


#############
### INPUT ###
#############

# Keyboard / mouse / touchpad
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    gesture=3,horizontal , workspace
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# Launchers / apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
#bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser

# Noctalia Launcher
bind = $mainMod, R, exec, noctalia msg panel-toggle launcher

# Session / window actions
bind = $mainMod, U, killactive,
bind = $mainMod, L, exec, noctalia msg screen-lock
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreenstate, 0 2
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, Q, exec, /home/nivedck/.config/hypr/scripts/battery.sh
bind = $mainMod, I, exec, /home/nivedck/.config/hypr/scripts/perfomance.sh
bind = $mainMod SHIFT, L, exit,
# Noctalia Window Switcher
bind = ALT, TAB, exec, noctalia msg window-switcher

# Noctalia UI
bind = $mainMod, C, exec, noctalia msg panel-toggle control-center
bind = $mainMod, S, exec, noctalia msg settings-toggle
bind = $mainMod,N, exec, noctalia msg panel-toggle control-center notifications
bind = $mainMod , T, exec, noctalia msg theme-mode-toggle
bind = $mainMod, M, exec, noctalia msg panel-toggle control-center media
bind = $mainMod, W, exec, noctalia msg panel-toggle wallpaper
bind = $mainMod SHIFT,W,exec,noctalia msg panel-toggle noctalia/wallhaven:browser
bind = $mainMod SHIFT, C, exec, noctalia msg caffeine-toggl

# Clipboard
bind = $mainMod , V, exec, noctalia msg panel-toggle clipboard
bind = $mainMod SHIFT, V, exec, noctalia msg clipboard-clear


# Noctalia UI
bind = $mainMod SHIFT, Y, exec, noctalia msg panel-toggle control-center system

# Screenshots
bind = , Print, exec, noctalia msg screenshot-fullscreen
bind = $mainMod SHIFT, S, exec, noctalia msg screenshot-region
# Focus movement (arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces: switch
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Workspaces: move active window
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspaces: scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize focused window
bind = SUPER SHIFT, left, resizeactive, -30 0
bind = SUPER SHIFT, right, resizeactive, 30 0
bind = SUPER SHIFT, up, resizeactive, 0 -30
bind = SUPER SHIFT, down, resizeactive, 0 30

# Multimedia keys
bindel = ,XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindel = ,XF86AudioLowerVolume, exec, noctalia msg volume-down
bindel = ,XF86AudioMute, exec, noctalia msg volume-mute
bindel = ,XF86AudioMicMute, exec, noctalia msg mic-mute

# Media control
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPause, exec, noctalia msg media toggle
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioPrev, exec, noctalia msg media previous

#brightness control
# Brightness
bindel = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindel = , XF86MonBrightnessDown, exec, noctalia msg brightness-down

